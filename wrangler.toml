# Configuration du Worker Folia (Cloudflare).
# Ce fichier indique à Cloudflare comment déployer le site + l'API de prix.

# Nom du projet → c'est lui qui forme la 1re partie de l'adresse :
#   folia.<ton-sous-domaine>.workers.dev
# Mets ici un nom neutre (sans ton nom/prénom).
name = "folia"

# Le script principal du Worker (gère /api/price et sert les fichiers).
main = "src/index.js"

# Date de compatibilité (fige le comportement du runtime). Ne pas y toucher.
compatibility_date = "2026-06-03"

# Fichiers statiques du site (HTML, CSS, JS) servis automatiquement.
# "binding = ASSETS" permet au Worker de déléguer à ces fichiers.
[assets]
directory = "./public"
binding = "ASSETS"

# Espace de stockage KV pour la SYNCHRONISATION PAR CODE (mobile ↔ PC).
# ⚠ Ces 3 lignes sont VOLONTAIREMENT en commentaire (le # devant) pour que le
#   déploiement réussisse même sans synchro. Pour ACTIVER la synchro :
#     1. crée un espace KV dans Cloudflare (voir le guide, section Synchro),
#     2. retire le # devant les 3 lignes ci-dessous,
#     3. remplace COLLE_ICI_TON_ID_KV par l'identifiant de ton espace KV.
[[kv_namespaces]]
binding = "FOLIA_KV"
id = "0d316ae197cc4782a49cfbe1b0513c8d"
